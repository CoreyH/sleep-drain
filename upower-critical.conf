# A UPower drop-in, installed by install.sh as
# /etc/UPower/UPower.conf.d/90-sleep-drain.conf.
#
# At 2% UPower takes its critical action. The stock CriticalPowerAction=Auto
# suspended this Mac on 2026-11-05 (logind: "suspend requested from client
# ... upowerd"). s2idle draws about 157 mA here, so the last ~100 mAh lasts
# about 40 minutes asleep, and the battery ran out overnight. Nothing here
# hibernates, so power off instead.
[UPower]
CriticalPowerAction=PowerOff
